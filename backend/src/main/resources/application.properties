spring.application.name=mihotel

# ---- Supabase ----
# Las credenciales reales van por variables de entorno (Railway) o en
# application-local.properties (desarrollo local, gitignored).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA ----
#spring.jpa.hibernate.ddl-auto=update //crea o actualiza las tablas solo segun las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---- Server (Railway inyecta PORT) ----
server.port=${PORT:8080}

# ---- Actuator (health check para monitoreo) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El health check de mail solo tiene sentido con SMTP real configurado
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:mihotel-clave-secreta-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiracion-minutos=1440

# ---- Uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Supabase Storage ----
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=fotos

# ---- Admin inicial ----
app.admin.email=${ADMIN_EMAIL:admin@mihotel.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Email ----
# Sin MAIL_HOST los emails se loguean en consola (modo dev).
# Para envio real configurar, por ejemplo con Gmail: host=smtp.gmail.com, puerto 587 y una "app password".
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@mihotel.com}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
